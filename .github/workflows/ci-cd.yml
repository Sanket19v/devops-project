name: ci-cd

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install dependencies
        run: pip install -r project-1-ai-cicd/app/requirements.txt
      - name: Run unit tests
        run: cd project-1-ai-cicd/app && pytest -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Run Bandit (SAST scanner)
        run: pip install bandit && bandit -r project-1-ai-cicd/app -ll
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: project-1-ai-cicd
          severity: HIGH,CRITICAL
          exit-code: "1"

  ai-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions: {contents: read, pull-requests: write}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install AI Review dependencies
        run: pip install -r project-1-ai-cicd/requirements-ai.txt
      - name: Run AI Code Review
        run: cd project-1-ai-cicd && python ai_review.py review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}

  build:
    if: github.event_name == 'push'
    needs: [test, security]
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/demo-app" >> $GITHUB_ENV
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: project-1-ai-cicd/app
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }},${{ env.IMAGE }}:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production   # Human approval gate (configured in GitHub Repo Settings -> Environments)
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Generate AI Release Notes
        run: cd project-1-ai-cicd && pip install -r requirements-ai.txt && python ai_review.py notes
        env: {ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"}
      - uses: azure/setup-kubectl@v4
      - name: Deploy to Kubernetes with Auto-Rollback
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          echo "$KUBE_CONFIG_B64" | base64 -d > "$HOME/kubeconfig"
          export KUBECONFIG="$HOME/kubeconfig"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/demo-app:${{ github.sha }}"
          kubectl set image deployment/demo-app app="$IMAGE"
          kubectl rollout status deployment/demo-app --timeout=120s || { kubectl rollout undo deployment/demo-app; exit 1; }
