apiVersion: v1
kind: ServiceAccount
metadata: {name: copilot}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: copilot}
rules:   # least privilege: read pods/logs, patch deployments. Nothing else.
  - {apiGroups: [""], resources: [pods, pods/log], verbs: [get, list]}
  - {apiGroups: [apps], resources: [deployments, deployments/scale], verbs: [get, list, patch]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: copilot}
subjects: [{kind: ServiceAccount, name: copilot}]
roleRef: {kind: Role, name: copilot, apiGroup: rbac.authorization.k8s.io}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: copilot}
spec:
  replicas: 1
  selector: {matchLabels: {app: copilot}}
  template:
    metadata: {labels: {app: copilot}}
    spec:
      serviceAccountName: copilot
      containers:
        - name: copilot
          image: copilot:local
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          env:
            - {name: REMEDIATE, value: "false"}   # flip to "true" after you trust it
            - name: ANTHROPIC_API_KEY
              valueFrom: {secretKeyRef: {name: llm-key, key: ANTHROPIC_API_KEY, optional: true}}
---
apiVersion: v1
kind: Service
metadata: {name: copilot}
spec:
  selector: {app: copilot}
  ports: [{port: 8000, targetPort: 8000}]
