# helm install monitoring prometheus-community/kube-prometheus-stack -f helm-values.yaml
prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
alertmanager:
  config:
    route:
      receiver: "null"
      group_by: ["alertname"]
      group_wait: 10s
      repeat_interval: 1h
      routes:
        - receiver: copilot
          matchers: ['app="demo-app"']
    receivers:
      - name: "null"
      - name: copilot
        webhook_configs:
          - url: http://copilot.default.svc:8000/alert
            send_resolved: false
